[project]
name = "dots-agent"
dynamic = ["version"]
description = "一个会主动发现任务、主动积累技能的智能体"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agent", "llm", "deepagents", "automation", "proactive", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "deepagents>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "python-dateutil>=2.8",
    # deepagents 只带 langchain-anthropic 和 langchain-google-genai,
    # 不带这个。而 dots init 自动探测首推的是 DeepSeek —— 走 openai: 协议。
    # 少这一行,README 里那条主路径装完就 ImportError。
    # 一个包换来 DeepSeek / Kimi / 通义 / 智谱 / 豆包 / 硅基流动 / OpenAI 全能跑。
    "langchain-openai>=0.3",
]

[project.optional-dependencies]
# 只有跑测试要用:生成自签证书起本地假 IMAP 服务器
test = ["cryptography>=41", "pytest>=8"]
# MCP 接入(飞书/Jira/Sigma/GitLab)。不装也能跑,只是没有外部系统工具。
mcp = ["langchain-mcp-adapters>=0.1"]
# 本体库采集元数据。按你要采的库装其中几个即可,不装就只能手工写本体。
ontology = ["psycopg[binary]>=3.1", "pymysql>=1.1", "pymongo>=4.6"]
# 微信群 UI 自动化采集要用 pyweixin(源码见 pywechat 仓库),这里只带它依赖的系统库。
# 仅 Windows 有意义;非 Windows 装得上也用不了。
wechat = [
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pyautogui>=0.9.54; sys_platform == 'win32'",
    "pywin32>=308; sys_platform == 'win32'",
    "psutil>=5.9",
]

[project.scripts]
dots = "dots.cli:main"

[project.urls]
Homepage = "https://github.com/duyongan/dots-agent"
Source = "https://github.com/duyongan/dots-agent"
Issues = "https://github.com/duyongan/dots-agent/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dots"]

[tool.setuptools.dynamic]
version = { attr = "dots.__version__" }

[tool.setuptools.package-data]
# dots init 要读这个模板。少了它,wheel 装完就 init 不了。
dots = ["template.toml", "webui/index.html", "webui/assets/*"]
