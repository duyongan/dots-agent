# dot —— 常驻主动式 agent 配置
# 所有相对路径都相对于本文件所在目录。密钥一律走环境变量,不写在这里。
#
# 最小可用:填好 [model],然后 python -m dot serve
# 邮件事件和邮件审批要额外填 [sources.imap] 和 [smtp]。

[dot]
tick_seconds = 60            # 心跳间隔。这就是「主动」的节拍
workspace = "workspace"      # agent 的工作目录 = 沙箱
db = "dot.db"

[model]
# anthropic:claude-sonnet-4-6
# DeepSeek 这类第三方端点要三件套:
#     name = "openai:deepseek-chat"
#     base_url = "https://api.deepseek.com"
#     api_key_env = "DEEPSEEK_API_KEY"
name = "anthropic:claude-sonnet-4-6"
# base_url = ""
# api_key_env = ""
max_tokens = 4096
temperature = 0.2

[smtp]
# 审批邮件和汇报都从这里发出去。不配也能跑,审批会退化成打终端 + CLI 批。
host = ""
port = 587
user = ""
sender = ""
to = ""                      # 审批邮件发给谁(通常就是你自己)
password_env = "DOT_SMTP_PASSWORD"
use_tls = true

[sources.fs]
# 最该先接的源:零鉴权、零网络。验证整条链路就靠它。
# 往 workspace/inbox/ 里扔个文件,dot 下一轮就会自己起来处理。
enabled = true
paths = ["inbox"]
interval = 120

[sources.imap]
# 一个 poller 干两件事:收事件 + 收审批回复(靠主题前缀区分)
enabled = false
host = ""
port = 993
user = ""
folder = "INBOX"
password_env = "DOT_IMAP_PASSWORD"
interval = 300
# 自建 Dovecot 用自签证书就把这个关掉。仍然加密,只是不验证书链。
verify_tls = true

[sources.ical]
# 日历。只在「某件事快开始了」时触发,不是日历文件一变就触发。
# 重复日程会用 dateutil 展开,不用你操心。
enabled = false
url = ""
interval = 900

[approval]
subject_prefix = "[dot#"
# 挂起的动作超过这么多小时没人批,自动按「拒绝」处理。0 = 永远等。
# 有限比无限好:一个永远等不到回复的审批 = 一个目标悄悄卡死。
timeout_hours = 72
# 按动作名匹配,支持通配(fs_* = "allow")。
#   allow = 白名单,直接执行
#   ask   = 挂起,发邮件等你回
#   deny  = 永不执行
# 没写到的动作一律 ask —— 默认从严,白名单才放宽。
[approval.rules]
send_email = "ask"
# 技能落盘会改变它以后的行为。想人工过目就改成 "ask"。
save_skill = "allow"
run_shell = "deny"

[skills]
# 技能库。agent 干活时会把可复用的流程用 save_skill 存下来,
# 下次同类任务开跑前,这些技能的「名字 + 描述」会出现在它的系统提示里。
# 目录是 workspace 下的相对路径,每个技能一个子目录,里面是 SKILL.md。
enabled = true
dir = "skills"

[handoff]
# 一个目标最多被交接几次。防乒乓 —— 两个 bot 互相甩锅能烧一整天。
max_hops = 3

# bot = 一套系统提示 + 一个工具子集。交接后新 bot 用同一条对话线,
# 所以它能看见前任做过什么,不会从头问一遍。
# dot 永远存在(通用型),下面是几个常见的。
# 自己加: [bots.名字] + prompt,tools 留空就是给全部工具。
[bots.ops]
prompt = """You are the operations half of `dot`. You take actions in the outside world:
sending mail, running commands, touching other systems.

Rules:
- Every action may be gated by a rule. If one is denied or denied by a human,
  report it and stop — do not look for another route to the same effect.
- Before any irreversible action, state in your final message exactly what you
  did so it can be checked afterwards.
- You do not do research or long-form writing. Hand those to `writer` or
  `scout` rather than doing a mediocre job of them.
"""

[bots.writer]
prompt = """You are the writing half of `dot`. You turn material that already exists into
finished prose: reports, summaries, replies, documentation.

Rules:
- Read the source material in the workspace first. Do not invent facts to fill
  a gap — say what is missing.
- Write the deliverable to a file in the workspace, not only in your reply.
- You do not send anything to anyone. Ask `ops` to do that.
"""

[bots.scout]
prompt = """You are the research half of `dot`. You gather and verify, you do not produce
finished deliverables and you do not take external actions.

Rules:
- Cite where each fact came from (file path, URL, message id).
- Distinguish what you verified from what you inferred.
- Hand the material to `writer` when it needs turning into prose.
"""

[safety]
# 0 = 不限制,只统计。想刹车就填个数(单位:token/天),不用改代码。
daily_token_budget = 0
